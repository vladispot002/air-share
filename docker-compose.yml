services:
  signaling:
    build:
      context: .
      dockerfile: Dockerfile
    image: landrop/signaling:2.0.0
    container_name: landrop-signaling
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - PORT=8080
      - TURN_SECRET=${TURN_SECRET}
      - COTURN_STATIC_AUTH_SECRET=${TURN_SECRET}
      - COTURN_REALM=${DOMAIN_NAME}
      - TRUST_PROXY=true
      - STUN_SERVERS=${STUN_SERVERS}
      - TURN_SERVERS=${TURN_SERVERS}
      - WEB_DIR=/app/web/dist
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - landrop-internal

  coturn:
    image: coturn/coturn:4.6.3-alpine
    container_name: landrop-coturn
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    command:
      - -n
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAIN_NAME}
      - --external-ip=${EXTERNAL_IP}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --lt-cred-mech
      - --no-cli
      - --no-multicast-peers
      - --no-loopback-peers
      # Anti-SSRF internal network isolation (IPv4 + IPv6)
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks:
      - landrop-internal

  caddy:
    image: caddy:2.8-alpine
    container_name: landrop-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    depends_on:
      signaling:
        condition: service_healthy
    networks:
      - landrop-internal

volumes:
  caddy_data:
  caddy_config:

networks:
  landrop-internal:
    driver: bridge
